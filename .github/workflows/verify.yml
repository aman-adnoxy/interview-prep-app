name: Validate and build app
on:
  push:
    branches: [main, feat/content-platform-v2]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CONTENT_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:content
      - run: npm test
      - run: npm run lint
      - run: npm run build
